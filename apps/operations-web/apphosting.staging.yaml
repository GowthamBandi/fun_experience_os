# Firebase App Hosting — staging overrides (merged over apphosting.yaml when the
# backend's environment name is "staging").
#
# TEMPLATE: replace every REPLACE_* / your-org value with the staging project's
# web app config (Firebase Console → Project settings → Your apps). These values
# are public web config, not secrets. The build refuses to run while any
# placeholder remains (scripts/verify-production-env.mjs).

env:
  - variable: NEXT_PUBLIC_APP_ENV
    value: staging
    availability: [BUILD, RUNTIME]
  - variable: EXPECTED_FIREBASE_PROJECT_ID
    value: your-org-experience-os-staging
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: your-org-experience-os-staging
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: your-org-experience-os-staging.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: your-org-experience-os-staging.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: REPLACE_WITH_WEB_API_KEY
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: REPLACE_WITH_SENDER_ID
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: REPLACE_WITH_WEB_APP_ID
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY
    value: REPLACE_WITH_RECAPTCHA_ENTERPRISE_SITE_KEY
    availability: [BUILD, RUNTIME]
